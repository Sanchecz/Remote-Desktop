# Optional RemoteIt SSH example. This file is never installed automatically.
# It deliberately preserves the owner's recovery path. Before using it, keep a
# second SSH session open, validate with `sshd -t`, and test a new login before
# closing the old session.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
AllowAgentForwarding no
AllowTcpForwarding yes
X11Forwarding no
PermitTunnel no
